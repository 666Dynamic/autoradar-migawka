const fmt = (n) => (n === null || n === undefined) ? '—' : Math.round(n).toLocaleString('pl-PL');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let sortKey = 'd_eur';
let sortDir = -1;
let onlyOk = false;

function value(r, key) {
  switch (key) {
    case 'name': return r.title;
    case 'total': return r.market_total;
    case 'compared': return r.compared;
    default: return r[key];
  }
}

function render() {
  const list = DATA.filter(r => !onlyOk || r.ok).sort((a, b) => {
    const x = value(a, sortKey), y = value(b, sortKey);
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    if (typeof x === 'string') return sortDir * x.localeCompare(y, 'pl');
    return sortDir * (x - y);
  });
  document.getElementById('rows').innerHTML = list.map(r => `

      <td><a href="${esc(r.auto1_url)}" target="_blank" rel="noopener">${esc(r.title)}</a><br><span class="small">${esc(r.id)}</span></td>

      <td class="num">${fmt(r.a_pln)}</td>

    </tr>`).join('');
}

document.getElementById('meta').textContent =
  `Aktualizacja: ${META.stamp}. Kurs NBP EUR: ${META.rate} PLN (${META.rate_date}). Porównanie: ${META.scan}.`;

document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
  const key = th.dataset.sort;
  sortDir = (sortKey === key) ? -sortDir : -1;
  sortKey = key;
  render();
}));
